name: linqua
description: "Linqua - Cross-platform mobile vocabulary acquisition application."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  http: ^1.2.2
  shared_preferences: ^2.3.2
  google_mlkit_translation: ^0.11.0
  translator: ^1.0.0
  connectivity_plus: ^6.0.5
  flutter_tts: ^4.0.2
  receive_sharing_intent: ^1.8.0
  flutter_card_swiper: ^7.0.1
  flip_card: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true